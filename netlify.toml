# Netlify Configuration for NOHADAYA Studio
# Website: https://www.nohadaya.com/

[build]
  publish = "."

# Global Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "upgrade-insecure-requests"

# Long-term Caching for WebP, Images, Icons, and Fonts
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# ERP Rewrite Rule (Clean URL for /erp)
[[redirects]]
  from = "/erp"
  to = "/erp/index.html"
  status = 200

[[redirects]]
  from = "/erp/*"
  to = "/erp/index.html"
  status = 200

# Custom 404 Routing
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

